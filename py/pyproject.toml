[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sessionknit"
version = "0.0.1"
description = "Durable, DAG-shaped session persistence that survives parallel tool calls and mid-turn interruption."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sessionknit"]
